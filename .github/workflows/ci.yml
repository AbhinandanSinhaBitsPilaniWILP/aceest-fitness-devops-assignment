name: ACEest Fitness CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest --junitxml=test-results.xml --cov=src/aceest --cov-report=xml --cov-report=term-missing

      - name: Run Ruff
        run: ruff check src tests scripts

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: aceest-ci-evidence
          path: |
            test-results.xml
            coverage.xml

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aceest-fitness:ci-${{ github.sha }}

