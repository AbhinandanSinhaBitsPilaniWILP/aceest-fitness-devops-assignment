apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  namespace: aceest
  labels:
    app: aceest-fitness-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-shadow
  template:
    metadata:
      labels:
        app: aceest-fitness-shadow
        version: shadow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: aceest-fitness
          image: aceest-fitness:candidate
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow
  namespace: aceest
spec:
  selector:
    app: aceest-fitness-shadow
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: aceest-fitness-shadow
  namespace: aceest
spec:
  hosts:
    - aceest-fitness
  http:
    - route:
        - destination:
            host: aceest-fitness
            subset: stable
      mirror:
        host: aceest-fitness-shadow
      mirrorPercentage:
        value: 100.0
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: aceest-fitness
  namespace: aceest
spec:
  host: aceest-fitness
  subsets:
    - name: stable
      labels:
        release: stable

