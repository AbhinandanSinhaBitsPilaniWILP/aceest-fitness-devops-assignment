apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-rolling
  namespace: aceest
  labels:
    app: aceest-fitness
    deployment-strategy: rolling
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: aceest-fitness-rolling
  template:
    metadata:
      labels:
        app: aceest-fitness-rolling
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000

