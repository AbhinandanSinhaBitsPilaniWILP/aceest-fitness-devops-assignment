apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
  namespace: aceest
  labels:
    app: aceest-fitness
    release: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      release: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        release: stable
        traffic: enabled
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: aceest-fitness
          image: aceest-fitness:stable
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  namespace: aceest
  labels:
    app: aceest-fitness
    release: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      release: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        release: canary
        traffic: enabled
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: aceest-fitness
          image: aceest-fitness:candidate
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    traffic: enabled
  ports:
    - port: 80
      targetPort: 8000

