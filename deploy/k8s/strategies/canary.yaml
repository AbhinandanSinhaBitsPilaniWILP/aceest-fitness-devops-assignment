apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
  namespace: aceest
  labels:
    app: aceest-fitness
    release: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      release: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        release: stable
        traffic: enabled
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:stable
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  namespace: aceest
  labels:
    app: aceest-fitness
    release: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      release: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        release: canary
        traffic: enabled
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:candidate
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    traffic: enabled
  ports:
    - port: 80
      targetPort: 8000

