apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-b
  namespace: aceest
  labels:
    app: aceest-fitness-b
    variant: b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-b
  template:
    metadata:
      labels:
        app: aceest-fitness-b
        variant: b
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:candidate
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-b
  namespace: aceest
spec:
  selector:
    app: aceest-fitness-b
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-ACEest-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "b"
spec:
  rules:
    - host: aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-fitness-b
                port:
                  number: 80

