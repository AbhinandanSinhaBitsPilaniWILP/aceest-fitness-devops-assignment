<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ACEest Fitness</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">ACEest Fitness and Gym</p>
        <h1>Track clients and progress in one place.</h1>
        <p class="lede">A small Flask service used to demonstrate an automated DevOps delivery pipeline.</p>
      </header>

      <section class="grid">
        <article class="card">
          <h2>Add client</h2>
          <form id="client-form">
            <label>Name <input name="name" required></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Goal <input name="goal" placeholder="Strength, mobility, endurance"></label>
            <button type="submit">Add client</button>
            <p id="form-message" role="status"></p>
          </form>
        </article>

        <article class="card">
          <div class="card-heading">
            <h2>Clients</h2>
            <button id="refresh" class="secondary" type="button">Refresh</button>
          </div>
          <ul id="client-list" class="client-list"><li>Loading...</li></ul>
        </article>
      </section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
